{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="theme-color" content="#0f172a"/>

    <title>Studio | TranStream</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2/dist/htmx.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
    <script src="{% static 'js/app.js' %}" defer></script>
</head>

<body class="h-full bg-slate-950 text-slate-100 antialiased">

<!-- HEADER NAVIGATION - FULL VIEWPORT WIDTH -->
<header class="fixed inset-x-0 top-0 z-50 border-b border-white/10 bg-slate-900/80 backdrop-blur-md">
    <div class="flex h-16 items-center justify-between gap-4 px-4">

        <!-- Left: Logo touches left border -->
        <a href="{% url 'studio:studio' %}" class="flex items-center gap-2 text-base font-semibold tracking-tight">
            <span>🎙️</span>
            <span>TranStream</span>
        </a>

        <!-- Center: Navigation -->
        <nav class="flex flex-wrap items-center gap-1 text-sm">
            <a href="{% url 'studio:studio' %}"
               class="rounded-md px-3 py-2 transition {% if page == 'studio' %}bg-slate-800 text-white{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}">
                Studio
            </a>

            <a href="{% url 'studio:settings' %}"
               class="rounded-md px-3 py-2 transition {% if page == 'settings' %}bg-slate-800 text-white{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}">
                Settings
            </a>

            <a href="{% url 'studio:account' %}"
               class="rounded-md px-3 py-2 transition {% if page == 'account' %}bg-slate-800 text-white{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}">
                MyAccount
            </a>

            <a href="{% url 'studio:about' %}"
               class="rounded-md px-3 py-2 transition {% if page == 'about' %}bg-slate-800 text-white{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}">
                About App
            </a>
        </nav>

        <!-- Right: Auth touches right border -->
        <div class="flex items-center gap-3">
            {% if user.is_authenticated %}
            <span class="hidden text-xs text-slate-400 sm:inline">
                {{ user.username }}
            </span>

            <form method="post" action="{% url 'logout' %}" class="inline">
                {% csrf_token %}
                <button
                    type="submit"
                    class="rounded-md border border-white/10 bg-slate-800/60 px-3 py-1.5 text-xs font-medium text-slate-300 transition hover:bg-rose-600/20 hover:text-rose-300"
                >
                    Sign Out
                </button>
            </form>
            {% else %}
            <a href="{% url 'login' %}"
               class="rounded-md border border-white/10 bg-transparent px-4 py-2 text-sm font-medium text-slate-300 transition hover:bg-slate-800 hover:text-white">
                Sign In
            </a>
            <a href="{% url 'studio:register' %}"
               class="rounded-md bg-cyan-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-cyan-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/50">
                Get Started
            </a>
            {% endif %}
        </div>

    </div>
</header>

<!-- STUDIO APP - FULL VIEWPORT, NO CONTAINER CONSTRAINTS -->
<div x-data="studioRecorder" x-init="init()" class="fixed inset-0 z-10 h-full bg-slate-950" style="--sidebar-width: 320px;">

  <!-- ─── LEFT SIDEBAR: MEDIA GALLERY ─── -->
  <aside
    x-data="mediaGallery()"
    x-init="init()"
    class="fixed left-0 top-16 z-40 h-[calc(100vh-4rem)] flex flex-col border-r border-white/10 bg-slate-900/80 backdrop-blur-md transition-all duration-300"
    style="width: var(--sidebar-width); min-width: 64px; max-width: 600px;"
  >
    <!-- Sidebar Header -->
    <div class="flex items-center justify-between h-14 px-3 border-b border-white/10">
      <div class="flex items-center gap-2">
        <svg class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
        </svg>
        <span x-show="!isCollapsed" class="text-sm font-semibold text-slate-100 transition-opacity">Media Gallery</span>
      </div>
      <button
        @click="toggleCollapse()"
        :title="isCollapsed ? 'Expand' : 'Collapse'"
        class="flex items-center justify-center w-8 h-8 rounded-lg text-slate-400 hover:text-white hover:bg-white/5 transition"
      >
        <svg class="w-4 h-4" :class="isCollapsed ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="transition: transform 0.2s;">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path>
        </svg>
      </button>
    </div>

    <!-- Resize Handle -->
    <div
      x-show="!isCollapsed"
      @mousedown.prevent="startResize"
      class="absolute right-0 top-0 h-full w-1 cursor-col-resize hover:bg-cyan-500/20 transition opacity-0 hover:opacity-100"
      title="Drag to resize"
    ></div>

    <!-- Gallery Content -->
    <div class="flex-1 overflow-y-auto" x-show="!isCollapsed" x-cloak>
      <!-- Settings / Path Config -->
      <div class="p-3 border-b border-white/10">
        <button
          @click="openSettings()"
          class="flex items-center gap-2 w-full px-3 py-2 rounded-xl text-slate-300 hover:bg-white/5 transition"
          title="Configure storage paths"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
          </svg>
          <span class="text-sm">Settings</span>
        </button>
      </div>

      <!-- Root Folders -->
      <template x-for="root in roots" :key="root.id">
        <div class="border-b border-white/5">
          <!-- Root Folder Header -->
          <div class="flex items-center gap-2 px-3 py-2">
            <button
              @click="root.expanded = !root.expanded"
              class="flex-shrink-0 w-6 h-6 flex items-center justify-center text-slate-400 hover:text-white"
              :title="root.expanded ? 'Collapse' : 'Expand'"
            >
              <svg class="w-4 h-4 transition-transform" :class="root.expanded ? 'rotate-90' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
              </svg>
            </button>
            <input
              type="text"
              x-model="root.name"
              @keydown.enter.prevent
              @blur="root.name = root.name.trim() || 'Unnamed'"
              class="flex-1 text-sm font-medium text-slate-100 bg-transparent border-none outline-none truncate"
            >
            <div class="flex items-center gap-1">
              <button
                @click="createFolder(root)"
                class="p-1.5 rounded text-slate-400 hover:text-white hover:bg-white/5 transition"
                title="New folder"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
              </button>
              <button
                @click="setUploadTarget(root)"
                class="p-1.5 rounded text-slate-400 hover:text-white hover:bg-white/5 transition"
                title="Upload audio"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
              </button>
              <button
                @click="removeRoot(root)"
                class="p-1.5 rounded text-rose-400 hover:text-rose-300 hover:bg-rose-500/10 transition"
                title="Remove root"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
              </button>
            </div>
          </div>

          <!-- Folder Tree (recursive) -->
          <template x-if="root.expanded">
            <div class="ml-6" x-html="renderFolderTree(root)"></div>
          </template>
        </div>
      </template>

      <!-- Empty state -->
      <template x-if="roots.length === 0">
        <div class="p-6 text-center text-slate-500">
          <svg class="w-12 h-12 mx-auto mb-3 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
          </svg>
          <p class="text-sm">No folders configured</p>
          <p class="text-xs mt-1">Click Settings to add root folders</p>
        </div>
      </template>
    </div>

    <!-- Collapsed state: just icons -->
    <div x-show="isCollapsed" class="flex-1 flex flex-col items-center py-4 gap-2 overflow-hidden">
      <button @click="openSettings()" class="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-white/5" title="Settings"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 001.066-2.573c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg></button>
      <template x-for="root in roots" :key="root.id">
        <button @click="root.expanded = !root.expanded" class="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-white/5" :title="root.name"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg></button>
      </template>
    </div>

    <!-- Settings Modal -->
    <div x-show="showSettings" x-cloak class="fixed inset-0 z-50 flex items-center justify-center">
      <div class="fixed inset-0 bg-black/50" @click="showSettings = false"></div>
      <div class="relative z-10 w-full max-w-lg rounded-2xl border border-white/10 bg-slate-900 p-6 shadow-2xl">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-lg font-semibold">Media Gallery Settings</h2>
      <button @click="showSettings = false" class="text-slate-400 hover:text-white">✕</button>
    </div>
    <div class="space-y-4">
      <template x-for="root in roots" :key="root.id">
        <div class="rounded-xl border border-white/10 bg-slate-950/50 p-4 space-y-3">
          <div class="flex items-center gap-3">
            <input type="text" x-model="root.name" class="flex-1 rounded-lg border border-white/10 bg-slate-900 px-3 py-2 text-sm text-white outline-none focus:border-cyan-400" placeholder="Folder name">
            <input type="text" x-model="root.path" class="flex-1 rounded-lg border border-white/10 bg-slate-900 px-3 py-2 text-sm text-white outline-none focus:border-cyan-400" placeholder="Local path (e.g. /home/user/recordings)">
            <button @click="removeRoot(root)" class="p-2 rounded text-rose-400 hover:text-rose-300" title="Remove">🗑️</button>
          </div>
        </div>
      </template>
      <button @click="addRoot()" class="w-full rounded-xl border-2 border-dashed border-cyan-400/50 bg-cyan-500/5 px-4 py-3 text-sm font-medium text-cyan-300 hover:bg-cyan-500/10 transition">+ Add Root Folder</button>
      <div class="pt-4 border-t border-white/10 flex justify-end gap-2">
        <button @click="saveSettings()" class="rounded-xl bg-cyan-600 px-4 py-2 text-sm font-semibold text-white hover:bg-cyan-500">Save</button>
        <button @click="showSettings = false" class="rounded-xl bg-slate-700 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-600">Cancel</button>
      </div>
    </div>
      </div>
    </div>

    <!-- Rename Modal -->
    <div x-show="renameItem" x-cloak class="fixed inset-0 z-50 flex items-center justify-center">
      <div class="fixed inset-0 bg-black/50" @click="cancelRename()"></div>
      <div class="relative z-10 w-full max-w-md rounded-2xl border border-white/10 bg-slate-900 p-6 shadow-2xl">
    <h3 class="text-lg font-semibold mb-4" x-text="'Rename ' + (renameItem.type === 'folder' ? 'Folder' : 'File')"></h3>
    <input type="text" x-model="renameItem.newName" x-ref="renameInput" @keyup.enter="confirmRename()" class="w-full rounded-lg border border-white/10 bg-slate-900 px-3 py-2 text-sm text-white outline-none focus:border-cyan-400 mb-4">
    <div class="flex justify-end gap-2">
      <button @click="confirmRename()" class="rounded-xl bg-cyan-600 px-4 py-2 text-sm font-semibold text-white hover:bg-cyan-500">Rename</button>
      <button @click="cancelRename()" class="rounded-xl bg-slate-700 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-600">Cancel</button>
    </div>
      </div>
    </div>

  </aside>

  <!-- ─── MAIN AREA: TRANSCRIPTION WINDOW (FIXED, SCROLLABLE) ─── -->
  <main
    class="fixed top-16 right-0 bottom-0 overflow-y-auto bg-slate-950 transition-all duration-300"
    :style="{ left: `var(--sidebar-width)` }"
  >
    <!-- Top Bar -->
    <header class="sticky top-0 z-30 h-16 border-b border-white/10 bg-slate-900/80 backdrop-blur-md">
      <div class="h-full flex items-center justify-between px-4 gap-4">
        <!-- Left: Status & Info -->
        <div class="flex items-center gap-4 min-w-0 flex-1">
          <!-- Live Indicator -->
          <div class="flex items-center gap-2">
            <span
              class="inline-flex h-2.5 w-2.5 rounded-full transition-all"
              :class="recording ? (liveTranscriptText ? 'bg-emerald-500 animate-pulse' : 'bg-red-500 animate-pulse')
                     : connecting ? 'bg-amber-400 animate-pulse'
                     : normalizing ? 'bg-blue-400 animate-pulse'
                     : vadRunning ? 'bg-purple-400 animate-pulse'
                     : transcribing ? 'bg-emerald-400 animate-pulse'
                     : 'bg-slate-600'"
            ></span>
            <span class="font-mono text-sm text-slate-200 tabular-nums" x-text="fmtTime(elapsedMs)">00:00:00.0</span>
            <span class="text-sm text-slate-400 whitespace-nowrap" x-text="pipelineLabel()">Idle</span>
          </div>

          <!-- Language Detected -->
          <template x-if="languageDetected || liveLanguage">
            <div class="flex items-center gap-1.5 text-sm">
              <span class="text-slate-500">Lang:</span>
              <span class="font-mono text-cyan-300" x-text="languageDetected || liveLanguage + ' (live)'"></span>
              <template x-if="languageProbability > 0">
                <span class="text-slate-600" x-text="'(' + Math.round(languageProbability * 100) + '%)'"></span>
              </template>
            </div>
          </template>

          <!-- Active Tab Indicator -->
          <template x-if="activeTabId">
            <span class="text-xs text-slate-500 px-2 py-0.5 bg-slate-800 rounded">Tab: <span class="text-slate-300" x-text="activeTab.title"></span></span>
          </template>

          <!-- METRICS DASHBOARD -->
          <template x-if="recording || (activeTab && activeTab.metrics)">
            <div class="flex items-center gap-3 ml-4 border-l border-white/10 pl-4">
              <!-- Detected Language -->
              <template x-if="metrics.language">
                <span class="flex items-center gap-1 text-xs px-2 py-1 rounded bg-slate-800 text-slate-300">
                  <span class="text-cyan-400">🌐</span>
                  <span class="font-mono" x-text="metrics.language.toUpperCase()"></span>
                </span>
              </template>

              <!-- Speech Speed (WPM) -->
              <template x-if="metrics.wpm !== undefined">
                <span class="flex items-center gap-1 text-xs px-2 py-1 rounded bg-slate-800 text-slate-300">
                  <span class="text-amber-400">⚡</span>
                  <span class="font-mono" x-text="Math.round(metrics.wpm)"></span>
                  <span>WPM</span>
                </span>
              </template>

              <!-- Transcription Latency -->
              <template x-if="metrics.latencyMs !== undefined">
                <span class="flex items-center gap-1 text-xs px-2 py-1 rounded bg-slate-800 text-slate-300">
                  <span class="text-blue-400">⏱</span>
                  <span class="font-mono" x-text="metrics.latencyMs"></span>
                  <span>ms</span>
                </span>
              </template>

              <!-- Speaker Count -->
              <template x-if="metrics.speakerCount !== undefined">
                <span class="flex items-center gap-1 text-xs px-2 py-1 rounded bg-slate-800 text-slate-300">
                  <span class="text-purple-400">👥</span>
                  <span class="font-mono" x-text="metrics.speakerCount"></span>
                </span>
              </template>

              <!-- Speaker Identities -->
              <template x-if="metrics.speakerNames && metrics.speakerNames.length > 0">
                <span class="flex items-center gap-1 text-xs px-2 py-1 rounded bg-slate-800 text-slate-300 max-w-[200px] truncate">
                  <span class="text-emerald-400">🎤</span>
                  <span x-text="metrics.speakerNames.join(', ')"></span>
                </span>
              </template>
            </div>
          </template>
        </div>

        <!-- Right: Actions -->
        <div class="flex items-center gap-2">
          <!-- Target Language Dropdown + Language Hint + Initial Prompt (Live Translation) -->
          <template x-if="recording">
            <div class="flex flex-col items-start gap-2">
              <div class="flex items-center gap-2">
                <label class="text-xs text-slate-500">Translate to:</label>
                <select
                  x-model="liveTranslationTarget"
                  @change="updateTranslationTarget()"
                  class="rounded-lg border border-white/10 bg-slate-900 px-2 py-1.5 text-xs text-white outline-none focus:border-cyan-400"
                >
                  <option value="en">English (en)</option>
                  <option value="es">Spanish (es)</option>
                  <option value="fr">French (fr)</option>
                  <option value="de">German (de)</option>
                  <option value="zh">Chinese (zh)</option>
                  <option value="ja">Japanese (ja)</option>
                  <option value="ko">Korean (ko)</option>
                  <option value="hi">Hindi (hi)</option>
                  <option value="ar">Arabic (ar)</option>
                  <option value="pt">Portuguese (pt)</option>
                  <option value="ru">Russian (ru)</option>
                  <option value="it">Italian (it)</option>
                  <option value="nl">Dutch (nl)</option>
                  <option value="pl">Polish (pl)</option>
                  <option value="tr">Turkish (tr)</option>
                  <option value="vi">Vietnamese (vi)</option>
                </select>
                <!-- Live Translation Mode Toggle -->
                <label class="flex items-center gap-1.5 cursor-pointer ml-2">
                  <input type="checkbox" x-model="showTranslatedOnly" class="rounded border-slate-600 text-cyan-500 focus:ring-cyan-500">
                  <span class="text-xs text-slate-300">Show translated only</span>
                </label>
              </div>
              <!-- Language Hint (Whisper language pin) -->
              <div class="flex items-center gap-2 ml-4">
                <label class="text-xs text-slate-500">Language hint:</label>
                <select
                  x-model="liveLanguageHint"
                  class="rounded-lg border border-white/10 bg-slate-900 px-2 py-1.5 text-xs text-white outline-none focus:border-cyan-400 w-40"
                >
                  <option value="">Auto-detect</option>
                  <option value="en">English (en)</option>
                  <option value="hi">Hindi (hi)</option>
                  <option value="es">Spanish (es)</option>
                  <option value="fr">French (fr)</option>
                  <option value="de">German (de)</option>
                  <option value="zh">Chinese (zh)</option>
                  <option value="ja">Japanese (ja)</option>
                  <option value="ko">Korean (ko)</option>
                  <option value="ar">Arabic (ar)</option>
                  <option value="pt">Portuguese (pt)</option>
                  <option value="ru">Russian (ru)</option>
                  <option value="it">Italian (it)</option>
                  <option value="nl">Dutch (nl)</option>
                  <option value="pl">Polish (pl)</option>
                  <option value="tr">Turkish (tr)</option>
                  <option value="vi">Vietnamese (vi)</option>
                </select>
                <span class="text-[10px] text-slate-500">(ISO 639-1, pins Whisper detection)</span>
              </div>
              <!-- Initial Prompt (vocabulary boost) -->
              <div class="flex items-start gap-2 ml-4">
                <label class="text-xs text-slate-500 mt-1">Initial prompt:</label>
                <textarea
                  x-model="liveInitialPrompt"
                  rows="2"
                  class="flex-1 min-w-[300px] max-w-[400px] rounded-lg border border-white/10 bg-slate-900 px-2 py-1.5 text-xs text-white outline-none focus:border-cyan-400 resize-none"
                  placeholder="Vocabulary boost (e.g. Siddhant, Kamailio, FFmpeg, VAD, WebSocket…) — per-take, not global"
                ></textarea>
              </div>
            </div>
          </template>

          <!-- Native Script Toggle -->
          <button
            type="button"
            @click="nativeScript = !nativeScript"
            title="Larger, looser rendering for reading this transcript in its own script"
            class="flex items-center gap-1.5 rounded-lg border border-cyan-400/20 bg-cyan-500/5 px-3 py-1.5 text-xs font-medium text-cyan-300 hover:bg-cyan-500/10 transition"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
            ✨ Native
          </button>

          <!-- Post-Recording: Voice Cloning Playback -->
          <template x-if="activeTab && activeTab.postRecording && activeTab.voiceCloningAvailable">
            <div class="flex items-center gap-2">
              <select
                x-model="voiceCloneSpeaker"
                class="rounded-lg border border-white/10 bg-slate-900 px-2 py-1.5 text-xs text-white outline-none focus:border-cyan-400"
              >
                <option value="">Select speaker…</option>
                <template x-for="spk in activeTab.speakerList" :key="spk">
                  <option :value="spk" x-text="spk"></option>
                </template>
              </select>
              <select
                x-model="voiceCloneTargetLang"
                class="rounded-lg border border-white/10 bg-slate-900 px-2 py-1.5 text-xs text-white outline-none focus:border-cyan-400"
              >
                <option value="en">en</option>
                <option value="es">es</option>
                <option value="fr">fr</option>
                <option value="de">de</option>
                <option value="zh">zh</option>
                <option value="ja">ja</option>
                <option value="hi">hi</option>
                <option value="ar">ar</option>
              </select>
              <button
                @click="playVoiceClone()"
                :disabled="voiceCloneLoading"
                class="flex items-center gap-1.5 rounded-xl bg-purple-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-purple-500 disabled:opacity-50 transition"
              >
                <template x-if="voiceCloneLoading">
                  <svg class="h-4 w-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                </template>
                <template x-if="!voiceCloneLoading">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1m8.5 10a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4a1 1 0 011-1h.5"></path></svg>
                  Clone
                </template>
              </button>
            </div>
          </template>
        </div>
      </div>

      <!-- Pipeline Progress Bar (collapsed under header) -->
      <template x-if="normalizing || vadRunning || transcribing">
        <div class="px-4 py-2 border-t border-white/5 bg-slate-900/50">
          <div class="flex items-center gap-3 text-xs">
            <svg class="h-4 w-4 animate-spin" :class="normalizing ? 'text-blue-400' : (vadRunning ? 'text-purple-400' : 'text-emerald-400')" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <span x-text="normalizing ? normalizeMessage : (vadRunning ? vadMessage : transcribeMessage)"></span>
          </div>
        </div>
      </template>
    </header>

    <!-- Transcription Canvas - Fixed, Scrollable -->
    <div
      class="p-4 space-y-4"
      style="min-height: calc(100vh - 128px);"
    >
      <!-- Error Banner -->
      <div
        x-show="error"
        x-cloak
        class="rounded-xl border border-rose-500/30 bg-rose-500/10 px-4 py-3 text-sm text-rose-200"
      >
        <div class="flex items-start justify-between gap-3">
          <div>
            <span class="font-semibold">Error:</span>
            <span x-text="error"></span>
          </div>
          <button
            type="button"
            @click="error = null"
            class="rounded-md border border-rose-400/30 px-2 py-1 text-xs text-rose-200 transition hover:bg-rose-500/20"
          >
            Dismiss
          </button>
        </div>
      </div>

      <!-- Tab Bar -->
      <template x-if="tabs.length > 0">
        <div class="flex gap-1 border-b border-white/10 pb-2 mb-4 overflow-x-auto">
          <template x-for="tab in tabs" :key="tab.id">
            <button
              type="button"
              @click="activeTabId = tab.id; _applyTabToUI(tab)"
              class="flex items-center gap-1.5 px-3 py-1.5 text-sm rounded-t-lg transition whitespace-nowrap"
              :class="[
                activeTabId === tab.id
                  ? 'bg-slate-800 text-white border-b-2 border-cyan-400'
                  : 'text-slate-400 hover:text-white hover:bg-slate-800'
              ]"
            >
              <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
                <template x-if="tab.source === 'mic'">
                  <path d="M10 15c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S7 3.34 7 5v7c0 1.66 1.34 3 3 3z"></path>
                </template>
                <template x-if="tab.source === 'upload'">
                  <path fill-rule="evenodd" d="M10 2a4 4 0 00-4 4v1h4V6a2 2 0 012-2h4a2 2 0 012 2v10a2 2 0 01-2 2H6a2 2 0 01-2-2V6a4 4 0 004-4zm2 5a2 2 0 012-2h4a2 2 0 012 2v10a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h4zm-2 7a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"></path>
                </template>
              </svg>
              <span class="truncate max-w-[140px]" x-text="tab.title"></span>
              <button
                type="button"
                @click.stop="closeTab(tab.id)"
                class="ml-1 p-0.5 rounded hover:bg-white/10 text-[10px] opacity-0 hover:opacity-100 transition"
              >✕</button>
            </button>
          </template>
        </div>
      </template>

      <!-- Tab Content -->
      <template x-if="tabs.length > 0 && activeTabId">
        <div x-show="activeTabId" class="space-y-4">
          <template x-if="activeTab">
            <!-- Transcription View for Active Tab -->
            <div class="rounded-xl border border-white/10 bg-slate-900/60 p-4 shadow-xl shadow-black/20 overflow-hidden">
              <div class="mb-4 flex flex-wrap items-center gap-2">
                <h3 class="font-semibold text-slate-100 truncate flex-1" x-text="activeTab.title"></h3>
                <span class="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-400" x-text="activeTab.source === 'mic' ? 'Microphone' : 'Upload'"></span>
                <span class="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-400" x-text="fmtTime(activeTab.durationMs)"></span>
                <template x-if="activeTab.language">
                  <span class="text-xs px-2 py-0.5 rounded bg-slate-800 text-cyan-300" x-text="activeTab.language"></span>
                  <template x-if="activeTab.languageProbability > 0">
                    <span class="text-xs text-slate-500" x-text="'(' + Math.round(activeTab.languageProbability * 100) + '%)'"></span>
                  </template>
                </template>
              </div>

              <!-- View Mode Controls -->
              <div class="mb-4 flex flex-wrap items-center gap-2 text-xs">
                <label class="flex items-center gap-1.5 cursor-pointer">
                  <input type="radio" x-model="transcriptView" value="subtitle" class="hidden peer">
                  <span class="px-2 py-1 rounded border text-slate-300 hover:text-white peer-checked:bg-cyan-500/20 peer-checked:border-cyan-400 peer-checked:text-cyan-300">Subtitle</span>
                </label>
                <label class="flex items-center gap-1.5 cursor-pointer">
                  <input type="radio" x-model="transcriptView" value="timestamp" class="hidden peer">
                  <span class="px-2 py-1 rounded border text-slate-300 hover:text-white peer-checked:bg-cyan-500/20 peer-checked:border-cyan-400 peer-checked:text-cyan-300">Timestamped</span>
                </label>
                <label class="flex items-center gap-1.5 cursor-pointer">
                  <input type="radio" x-model="transcriptView" value="compact" class="hidden peer">
                  <span class="px-2 py-1 rounded border text-slate-300 hover:text-white peer-checked:bg-cyan-500/20 peer-checked:border-cyan-400 peer-checked:text-cyan-300">Compact</span>
                </label>

                <label class="ml-auto flex items-center gap-1.5 cursor-pointer">
                  <input type="checkbox" x-model="showTimestamps" class="rounded border-slate-600 text-cyan-500 focus:ring-cyan-500">
                  <span class="text-slate-300">Timestamps</span>
                </label>

                <!-- Speaker Filter -->
                <template x-if="speakerList().length > 1">
                  <span class="text-slate-500">Speaker:</span>
                  <select x-model="activeSpeaker" class="rounded border border-white/10 bg-slate-900 px-2 py-1 text-sm text-white outline-none focus:border-cyan-400">
                    <option value="">All speakers</option>
                    <template x-for="spk in speakerList()" :key="spk">
                      <option :value="spk" x-text="spk"></option>
                    </template>
                  </select>
                </template>

                <!-- Actions -->
                <button @click="copyTranscript()" class="ml-2 px-2 py-1 rounded border border-white/10 text-slate-300 hover:bg-white/5 text-xs">📋 Copy</button>
                <button @click="exportSrt()" class="px-2 py-1 rounded border border-white/10 text-slate-300 hover:bg-white/5 text-xs">📄 SRT</button>
              </div>

              <!-- Segments -->
              <div class="space-y-2" :class="nativeScript ? 'text-lg leading-relaxed' : ''">
                <template x-for="seg in filteredSegments()" :key="seg.index">
                  <div class="group rounded-lg p-3 hover:bg-white/5 transition" :class="speakerColor(getSpeaker(seg.index))">
                    <div class="flex items-start gap-3">
                      <!-- Speaker Chip -->
                      <template x-if="transcriptView === 'subtitle'">
                        <span class="flex-shrink-0 text-xs font-medium px-1.5 py-0.5 rounded" :class="speakerColor(getSpeaker(seg.index))" x-text="getSpeaker(seg.index)"></span>
                      </template>
                      <template x-if="transcriptView === 'timestamp'">
                        <span class="flex-shrink-0 text-xs font-mono text-slate-400 w-20" x-text="fmtSegTime(seg.start_ms) + ' → ' + fmtSegTime(seg.end_ms)"></span>
                        <span class="flex-shrink-0 text-xs font-medium px-1.5 py-0.5 rounded" :class="speakerColor(getSpeaker(seg.index))" x-text="getSpeaker(seg.index)"></span>
                      </template>
                      <template x-if="transcriptView === 'compact'">
                        <span class="flex-shrink-0 text-xs font-mono text-slate-500" x-text="fmtSegTime(seg.start_ms)"></span>
                      </template>

                      <!-- Text -->
                      <p class="flex-1 min-w-0 text-slate-100 break-words" x-text="seg.text"></p>
                    </div>

                    <!-- Full Timestamp Row (timestamp view only) -->
                    <template x-if="transcriptView === 'timestamp' && showTimestamps">
                      <div class="mt-1 ml-8 flex items-center gap-2 text-xs text-slate-500">
                        <span class="font-mono" x-text="fmtSegTime(seg.start_ms) + ' → ' + fmtSegTime(seg.end_ms)"></span>
                        <span class="text-slate-600" x-text="'(' + seg.duration_ms + ' ms)'"></span>
                        <template x-if="seg.confidence !== undefined && seg.confidence !== null">
                          <span class="text-emerald-400" x-text="'conf: ' + Math.round(seg.confidence * 100) + '%'"></span>
                        </template>
                      </div>
                    </template>

                    <!-- Post-Recording: Script Override -->
                    <template x-if="activeTab.postRecording && seg.editable">
                      <div class="mt-2 flex items-center gap-2">
                        <textarea
                          x-model="seg.editedText"
                          @blur="saveScriptEdit(seg.index)"
                          class="flex-1 rounded border border-white/10 bg-slate-900 px-2 py-1 text-sm text-white outline-none focus:border-cyan-400 resize-none min-h-[2.5rem]"
                          placeholder="Edit transcript…"
                        ></textarea>
                        <select
                          x-model="seg.displayLang"
                          @change="saveScriptEdit(seg.index)"
                          class="rounded border border-white/10 bg-slate-900 px-2 py-1 text-sm text-white outline-none focus:border-cyan-400"
                        >
                          <option value="original">Original</option>
                          <option value="translated">Translated</option>
                          <option value="both">Both</option>
                        </select>
                      </div>
                    </template>
                  </div>
                </template>

                <template x-if="filteredSegments().length === 0">
                  <p class="text-center text-slate-500 py-8">No segments match the current filter.</p>
                </template>
              </div>
            </div>

            <!-- Translation Section -->
            <div class="rounded-xl border border-white/10 bg-slate-900/60 p-4 shadow-xl shadow-black/20 overflow-hidden">
              <button
                type="button"
                @click="micTranslationExpanded = !micTranslationExpanded"
                class="flex items-center justify-between w-full mb-3"
              >
                <h3 class="font-semibold text-slate-100 flex items-center gap-2">
                  <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-5"></path></svg>
                  Translation
                </h3>
                <svg class="w-5 h-5 text-slate-400 transition-transform" :class="micTranslationExpanded ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
              </button>

              <template x-if="micTranslationExpanded">
                <div class="space-y-3">
                  <!-- Target Language -->
                  <div class="flex items-center gap-3">
                    <label class="text-sm text-slate-300 w-24">Target:</label>
                    <select
                      x-model="micTranslationTarget"
                      class="flex-1 rounded-lg border border-white/10 bg-slate-900 px-3 py-2 text-sm text-white outline-none focus:border-cyan-400"
                    >
                      <option value="en">English (en)</option>
                      <option value="es">Spanish (es)</option>
                      <option value="fr">French (fr)</option>
                      <option value="de">German (de)</option>
                      <option value="zh">Chinese (zh)</option>
                      <option value="ja">Japanese (ja)</option>
                      <option value="ko">Korean (ko)</option>
                      <option value="hi">Hindi (hi)</option>
                      <option value="ar">Arabic (ar)</option>
                      <option value="pt">Portuguese (pt)</option>
                      <option value="ru">Russian (ru)</option>
                      <option value="it">Italian (it)</option>
                      <option value="nl">Dutch (nl)</option>
                      <option value="pl">Polish (pl)</option>
                      <option value="tr">Turkish (tr)</option>
                      <option value="vi">Vietnamese (vi)</option>
                    </select>
                  </div>

                  <!-- Translate Button -->
                  <button
                    type="button"
                    @click="translateMic()"
                    :disabled="micTranslationLoading || !takeId"
                    class="w-full flex items-center justify-center gap-2 rounded-xl bg-cyan-600 px-4 py-2 text-sm font-semibold text-white hover:bg-cyan-500 disabled:opacity-50 disabled:cursor-not-allowed transition"
                  >
                    <template x-if="micTranslationLoading">
                      <svg class="h-5 w-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                      Translating…
                    </template>
                    <template x-if="!micTranslationLoading">
                      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-5"></path></svg>
                      Translate to <span x-text="micTranslationTarget.toUpperCase()"></span>
                    </template>
                  </button>

                  <!-- Translation Error -->
                  <template x-if="micTranslationError">
                    <div class="rounded-lg border border-rose-500/30 bg-rose-500/10 px-3 py-2 text-sm text-rose-200" x-text="micTranslationError"></div>
                  </template>

                  <!-- Translation Result -->
                  <template x-if="micTranslationText && !micTranslationLoading">
                    <div class="space-y-2">
                      <div class="flex items-center justify-between">
                        <h4 class="font-semibold text-slate-100">Translated Text (<span x-text="micTranslationSource.toUpperCase()"></span> → <span x-text="micTranslationTarget.toUpperCase()"></span>)</h4>
                        <div class="flex items-center gap-2">
                          <button @click="copyTranscript()" class="px-2 py-1 rounded border border-white/10 text-slate-300 hover:bg-white/5 text-xs">📋 Copy Translation</button>
                          <button
                            type="button"
                            @click="stopTtsPlayback()"
                            class="px-2 py-1 rounded border border-white/10 text-slate-300 hover:bg-white/5 text-xs"
                          >⏹ Stop</button>
                        </div>
                      </div>
                      <p class="text-slate-100 whitespace-pre-wrap" x-text="micTranslationText"></p>
                    </div>
                  </template>
                </div>
              </template>
            </div>

            <!-- Audio Players (collapsible) -->
            <template x-if="saved && saved.url && !recording">
              <details class="rounded-2xl border border-amber-500/20 bg-amber-500/5 p-4">
                <summary class="flex items-center gap-2 cursor-pointer text-sm font-semibold text-amber-300">Raw Browser Capture</summary>
                <div class="mt-3">
                  <audio controls class="w-full" :src="saved.url"></audio>
                  <a :href="saved.url" :download="saved.filename" class="mt-2 inline-block rounded-xl bg-amber-700 px-3 py-2 text-sm font-semibold text-white hover:bg-amber-600">⬇️ Download Raw</a>
                </div>
              </details>
            </template>

            <template x-if="normalized && normalized.output_url && !recording && !normalizing">
              <details class="rounded-2xl border border-blue-500/20 bg-blue-500/5 p-4">
                <summary class="flex items-center gap-2 cursor-pointer text-sm font-semibold text-blue-300">Normalized PCM WAV</summary>
                <div class="mt-3">
                  <p class="text-xs text-slate-400 mb-2">
                    <span x-text="fmtSampleRate(normalized.sample_rate)"></span> · <span x-text="normalized.channels"></span> ch · <span x-text="normalized.bit_depth"></span>-bit · <span x-text="fmtBytes(normalized.size_bytes)"></span>
                  </p>
                  <audio controls class="w-full" :src="normalized.output_url"></audio>
                  <a :href="normalized.output_url" :download="normalized.output_file" class="mt-2 inline-block rounded-xl bg-blue-700 px-3 py-2 text-sm font-semibold text-white hover:bg-blue-600">⬇️ Download WAV</a>
                </div>
              </details>
            </template>

            <!-- Post-Recording: Audio Playback Widget -->
            <template x-if="activeTab.postRecording && activeTab.audioUrl">
              <details class="rounded-2xl border border-emerald-500/20 bg-emerald-500/5 p-4 open">
                <summary class="flex items-center gap-2 cursor-pointer text-sm font-semibold text-emerald-300">Finalized Recording (recorder/)</summary>
                <div class="mt-3">
                  <audio controls class="w-full" :src="activeTab.audioUrl"></audio>
                  <a :href="activeTab.audioUrl" :download="activeTab.audioFilename" class="mt-2 inline-block rounded-xl bg-emerald-700 px-3 py-2 text-sm font-semibold text-white hover:bg-emerald-600">⬇️ Download Finalized</a>
                </div>
              </details>
            </template>
          </template>
        </div>
      </template>

      <!-- Empty State (no tabs) -->
      <template x-if="tabs.length === 0 && !recording && !saved && !connecting && !normalizing && !vadRunning && !transcribing">
        <div class="space-y-4 text-center py-12">
          <svg class="w-16 h-16 mx-auto text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
          </svg>
          <p class="text-slate-300 text-lg">TranStream Studio</p>
          <p class="text-slate-500 max-w-md mx-auto">
            Press <kbd class="px-2 py-1 bg-slate-800 rounded text-cyan-300 font-mono">Space</kbd> or click <span class="text-emerald-300">Record</span> to capture microphone audio.
            Use the <span class="text-cyan-300">Media Gallery</span> on the left to upload and manage audio files.
            Click any file with an existing transcription to open it instantly in a tab.
          </p>
          <div class="flex items-center justify-center gap-4 mt-6 text-xs text-slate-500">
            <span>Pipeline: Record → Normalize → VAD → Whisper</span>
            <span>Live preview streams while you speak</span>
          </div>
        </div>
      </template>

      <!-- Recording Live Preview -->
      <template x-if="recording">
        <div class="space-y-4">
          <div class="rounded-xl border border-red-500/30 bg-red-500/5 p-4 animate-pulse">
            <div class="flex items-center gap-3">
              <span class="inline-flex h-3 w-3 rounded-full bg-red-500 animate-pulse"></span>
              <p class="text-red-300 font-medium">● Live ingestion active</p>
              <span class="ml-auto font-mono text-sm text-slate-200" x-text="fmtTime(elapsedMs)"></span>
            </div>
            <p class="mt-2 text-slate-400">Speak now. 100 ms chunks are streaming to the backend.</p>
          </div>

          <!-- Live Transcript with Translation -->
          <template x-if="liveTranscriptText || liveTranslationText">
            <div class="rounded-xl border border-emerald-500/25 bg-emerald-500/5 p-4">
              <div class="mb-2 flex items-center gap-2">
                <span class="inline-flex h-2 w-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <p class="text-xs font-semibold uppercase tracking-wider text-emerald-400">Live Transcript Preview</p>
                <span class="ml-auto text-[10px] text-slate-500"><span x-text="liveSegmentCount"></span> seg · rolling</span>
              </div>
              <template x-if="showTranslatedOnly && liveTranslationText">
                <p class="text-sm leading-relaxed text-cyan-300 whitespace-pre-wrap" x-text="liveTranslationText"></p>
                <p class="mt-2 text-[11px] text-slate-500" x-text="'Showing live translation (' + liveTranslationTarget.toUpperCase() + ')'"></p>
              </template>
              <template x-if="!showTranslatedOnly || !liveTranslationText">
                <p class="text-sm leading-relaxed text-slate-100 whitespace-pre-wrap" x-text="liveTranscriptText"></p>
                <p class="mt-2 text-[11px] text-slate-500">Interim text — the authoritative timestamped transcript replaces this after Stop.</p>
              </template>
            </div>
          </template>

          <template x-if="!liveTranscriptText && !liveTranslationText">
            <p class="text-center text-xs text-slate-500 py-4">Keep speaking ~3 seconds for the live preview to appear…</p>
          </template>
        </div>
      </template>

      <!-- Live Transcript Persisted (after stop) -->
      <template x-if="!recording && saved && liveTranscriptText && tabs.length === 0">
        <div class="rounded-xl border border-emerald-500/25 bg-emerald-500/5 p-4">
          <div class="mb-2 flex items-center gap-2">
            <span class="inline-flex h-2 w-2 rounded-full bg-emerald-400"></span>
            <p class="text-xs font-semibold uppercase tracking-wider text-emerald-400">Live Transcript Preview (Last Update)</p>
            <span class="ml-auto text-[10px] text-slate-500"><span x-text="liveSegmentCount"></span> seg</span>
          </div>
          <p class="text-sm leading-relaxed text-slate-100 whitespace-pre-wrap" x-text="liveTranscriptText"></p>
          <p class="mt-2 text-[11px] text-slate-500">This was the rolling preview during recording. The authoritative transcript is below.</p>
        </div>
      </template>

      <!-- Processing States -->
      <template x-if="normalizing && !recording && tabs.length === 0">
        <div class="rounded-xl border border-blue-500/20 bg-blue-500/5 p-4">
          <p class="text-blue-300">⟳ Normalizing audio…</p>
          <p class="text-slate-400" x-text="normalizeMessage"></p>
        </div>
      </template>

      <template x-if="vadRunning && !recording && !normalizing && tabs.length === 0">
        <div class="rounded-xl border border-purple-500/20 bg-purple-500/5 p-4">
          <p class="text-purple-300">◈ Detecting speech segments…</p>
          <p class="text-slate-400" x-text="vadMessage"></p>
        </div>
      </template>

      <template x-if="transcribing && !recording && !normalizing && !vadRunning && tabs.length === 0">
        <div class="rounded-xl border border-emerald-500/20 bg-emerald-500/5 p-4">
          <p class="text-emerald-300">◈ Transcribing audio…</p>
          <p class="text-slate-400" x-text="transcribeMessage"></p>
        </div>
      </template>

      <!-- Upload Processing (inline, when upload tab is active) -->
      <template x-if="upload.uploading || upload.polling">
        <div class="rounded-xl border border-cyan-500/20 bg-cyan-500/5 p-4">
          <div class="mb-2 flex items-center gap-2">
            <svg class="h-5 w-5 animate-spin text-cyan-400" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <p class="text-cyan-300" x-text="uploadStatusLabel()"></p>
          </div>
          <div class="h-1.5 w-full overflow-hidden rounded-full bg-slate-800">
            <div class="h-full rounded-full bg-cyan-400 transition-all duration-300" :style="'width:' + (upload.uploading ? upload.progress : upload.pct) + '%'"></div>
          </div>
        </div>
      </template>
    </div>

    </main>

    <!-- ─── DRAGGABLE MIC BUTTON (direct child of studio container, not inside main's overflow) ─── -->
    <button
      type="button"
      @click="toggleRecording()"
      @mousedown.prevent="startMicDrag"
      :disabled="connecting || normalizing || vadRunning || transcribing"
      :class="[
        'fixed z-50 flex items-center justify-center rounded-full p-3 text-sm transition shadow-xl cursor-move',
        recording ? 'bg-rose-600 text-white hover:bg-rose-500' : 'bg-emerald-600 text-white hover:bg-emerald-500',
        (connecting || normalizing || vadRunning || transcribing) ? 'opacity-50 cursor-not-allowed' : '',
        micDragging ? 'cursor-grabbing scale-110' : ''
      ]"
      :title="recording ? 'Stop recording (Space) — Drag to move' : 'Start recording (Space) — Drag to move'"
      :style="{ left: micPos.x + 'px', top: micPos.y + 'px', right: 'auto', bottom: 'auto' }"
    >
      <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
        <template x-if="recording">
          <rect x="6" y="4" width="12" height="16" rx="2"></rect>
        </template>
        <template x-if="!recording">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"></path>
        </template>
      </svg>
    </button>

</div>


<!-- Hidden file input for Media Gallery uploads -->
<input type="file" id="ts-mg-upload-input" multiple accept="audio/*" x-ref="mgUploadInput" @change="onMgFileChosen" class="hidden">

<script src="{% static 'js/studio.js' %}"></script>

<!-- Alpine components: mediaGallery & studioRecorder -->
<script>
document.addEventListener('alpine:init', () => {
  // ─── Media Gallery Sidebar Component ───
  Alpine.data('mediaGallery', () => ({
    isCollapsed: false,
    showSettings: false,
    renameItem: null,
    roots: [],
    mgUploadInput: null,

    init() {
      // Load roots from localStorage
      const stored = localStorage.getItem('ts_media_roots');
      if (stored) {
        try {
          this.roots = JSON.parse(stored);
        } catch (e) {
          console.warn('Failed to parse media roots:', e);
          this.roots = [];
        }
      }
      // Expand first root by default
      if (this.roots.length > 0 && !this.roots[0].expanded) {
        this.roots[0].expanded = true;
      }
    },

    toggleCollapse() {
      this.isCollapsed = !this.isCollapsed;
      // Update CSS variable on parent studioRecorder element
      const rootEl = document.querySelector('[x-data="studioRecorder"]');
      if (rootEl) {
        rootEl.style.setProperty('--sidebar-width', this.isCollapsed ? '64px' : '320px');
      }
    },

    openSettings() {
      this.showSettings = true;
    },

    saveSettings() {
      localStorage.setItem('ts_media_roots', JSON.stringify(this.roots));
      this.showSettings = false;
    },

    addRoot() {
      this.roots.push({
        id: crypto.randomUUID(),
        name: 'New Folder',
        path: '',
        expanded: true
      });
    },

    removeRoot(root) {
      this.roots = this.roots.filter(r => r.id !== root.id);
    },

    setUploadTarget(root) {
      this.uploadTargetRoot = root;
      this.$refs.mgUploadInput.click();
    },

    onMgFileChosen(event) {
      const files = Array.from(event.target.files);
      if (!files.length || !this.uploadTargetRoot) return;

      // Simulate upload — in real implementation, would POST to /studio/upload/
      files.forEach(file => {
        console.log('Upload:', file.name, 'to', this.uploadTargetRoot.path);
      });
      event.target.value = '';
      this.uploadTargetRoot = null;
    },

    createFolder(parent) {
      const newFolder = {
        id: crypto.randomUUID(),
        name: 'New Folder',
        path: '',
        expanded: true,
        children: []
      };
      if (parent.children) {
        parent.children.push(newFolder);
      } else {
        parent.children = [newFolder];
      }
    },

    confirmRename() {
      if (this.renameItem && this.renameItem.newName.trim()) {
        this.renameItem.element.name = this.renameItem.newName.trim();
      }
      this.renameItem = null;
    },

    cancelRename() {
      this.renameItem = null;
    },

    startResize(event) {
      event.preventDefault();
      event.stopPropagation();

      const startX = event.clientX;
      const rootEl = document.querySelector('[x-data="studioRecorder"]');
      const startWidth = rootEl ? parseFloat(getComputedStyle(rootEl).getPropertyValue('--sidebar-width')) : 320;

      const onMouseMove = (e) => {
        const deltaX = e.clientX - startX;
        const newWidth = Math.max(64, Math.min(600, startWidth + deltaX));
        if (rootEl) {
          rootEl.style.setProperty('--sidebar-width', newWidth + 'px');
        }
        this.isCollapsed = newWidth <= 64;
      };

      const onMouseUp = () => {
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
        document.body.style.userSelect = '';
        document.body.style.cursor = '';
      };

      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
      document.body.style.userSelect = 'none';
      document.body.style.cursor = 'col-resize';
    },

    renderFolderTree(folder) {
      if (!folder.children || !folder.children.length) return '';
      let html = '<div class="space-y-1">';
      for (const child of folder.children) {
        html += `
          <div class="border-l border-white/5 pl-4">
            <div class="flex items-center gap-2 px-3 py-1.5">
              <button class="p-1 rounded text-slate-500 hover:text-white" title="New folder" @click.self="createFolder($event)"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 002-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg></button>
              <span class="flex-1 text-sm text-slate-100 bg-transparent border-none outline-none truncate">${child.name}</span>
              <button class="p-1 rounded text-rose-500 hover:text-rose-300" title="Remove" @click.self="removeRootFromTree($event, '${child.id}')"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
            </div>
          </div>
        `;
      }
      html += '</div>';
      return html;
    },

    removeRootFromTree(event, childId) {
      event.stopPropagation();
      console.log('Remove child:', childId);
    },

    openExistingTab(takeId, shortId) {
      console.log('openExistingTab:', takeId, shortId);
      // Implemented in studioRecorder
      if (window.studioRecorderInstance) {
        window.studioRecorderInstance.openExistingTab(takeId, shortId);
      }
    }
  }));

  // ─── Studio Recorder Main Component ───
  Alpine.data('studioRecorder', () => ({
    // State
    state: 'idle', // idle, connecting, recording, normalizing, vadRunning, transcribing, postProcessing
    recording: false,
    connecting: false,
    normalizing: false,
    vadRunning: false,
    transcribing: false,
    languageDetected: '',
    liveLanguage: '',
    languageProbability: 0,
    liveTranscriptText: '',
    elapsedMs: 0,
    activeTabId: null,
    activeTab: null,
    metrics: {
      wpm: 0,
      latencyMs: 0,
      speakerCount: 0,
      speakers: [],
      speakerNames: [],
      language: 'en'
    },
    nativeScript: false,
    micTranslationExpanded: false,
    micTranslationTarget: 'en',
    micTranslationLoading: false,
    micTranslationError: '',
    micTranslationText: '',
    micTranslationSource: '',
    takeId: null,
    isMobile: false,
    upload: {
      uploading: false,
      polling: false,
      progress: 0,
      pct: 0
    },
    nativeScriptMode: false,
    transcriptView: 'subtitle',
    showTimestamps: false,
    activeSpeaker: 'all',
    liveTranslationTarget: 'en',
    showTranslatedOnly: false,
    liveLanguageHint: '',
    liveInitialPrompt: '',
    voiceCloneSpeaker: '',
    voiceCloneTargetLang: 'en',
    normalized: {
      sample_rate: 16000,
      channels: 1,
      bit_depth: 16,
      size_bytes: 0
    },
    liveTranslationText: '',
    liveSegmentCount: 0,
    normalizeMessage: 'Normalizing audio…',
    vadMessage: 'Detecting speech…',
    transcribeMessage: 'Transcribing…',
    error: '',
    tabs: [],

    // WebSocket & MediaRecorder
    ws: null,
    mediaRecorder: null,
    audioChunks: [],
    wsUrl: null,
    sessionId: null,
    micDragging: false,
    micPos: { x: window.innerWidth - 80, y: window.innerHeight - 80 },
    micDragOffset: { x: 0, y: 0 },
    micMoved: false,

    // Computed
    pipelineLabel() {
      const labels = {
        idle: 'Idle',
        connecting: 'Connecting…',
        recording: 'Recording',
        normalizing: 'Normalizing',
        vadRunning: 'Voice Activity Detection',
        transcribing: 'Transcribing',
        postProcessing: 'Post-processing…'
      };
      return labels[this.state] || 'Idle';
    },

    fmtTime(ms) {
      if (!ms) return '00:00:00.0';
      const d = new Date(ms);
      const hh = String(d.getUTCHours()).padStart(2, '0');
      const mm = String(d.getUTCMinutes()).padStart(2, '0');
      const ss = String(d.getUTCSeconds()).padStart(2, '0');
      const ms3 = String(d.getUTCMilliseconds()).padStart(3, '0')[0];
      return `${hh}:${mm}:${ss}.${ms3}`;
    },

    fmtSegTime(ms) {
      if (!ms && ms !== 0) return '00:00:00';
      const s = Math.floor(ms / 1000);
      const hh = String(Math.floor(s / 3600)).padStart(2, '0');
      const mm = String(Math.floor((s % 3600) / 60)).padStart(2, '0');
      const ss = String(s % 60).padStart(2, '0');
      return `${hh}:${mm}:${ss}`;
    },

    fmtSampleRate(rate) {
      return rate >= 1000 ? (rate / 1000).toFixed(1) + 'k' : rate;
    },

    fmtBytes(bytes) {
      if (!bytes) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB'];
      let i = 0;
      while (bytes >= 1024 && i < units.length - 1) {
        bytes /= 1024;
        i++;
      }
      return bytes.toFixed(1) + ' ' + units[i];
    },

    pipelineBusy() {
      return ['recording', 'normalizing', 'vadRunning', 'transcribing', 'postProcessing'].includes(this.state);
    },

    // ─── Mic Button Drag ───
    startMicDrag(event) {
      if (this.pipelineBusy() && !this.recording) return;
      this.micDragging = true;
      this.micMoved = false;
      const rect = event.target.getBoundingClientRect();
      this.micDragOffset.x = event.clientX - rect.left;
      this.micDragOffset.y = event.clientY - rect.top;
      const moveHandler = (e) => this._onMicDrag(e);
      const upHandler = () => this._onMicDragEnd();
      this._micMoveHandler = moveHandler;
      this._micUpHandler = upHandler;
      document.addEventListener('mousemove', moveHandler);
      document.addEventListener('mouseup', upHandler);
      document.body.style.userSelect = 'none';
    },

    _onMicDrag(event) {
      if (!this.micDragging) return;
      const newX = event.clientX - this.micDragOffset.x;
      const newY = event.clientY - this.micDragOffset.y;
      // Constrain to viewport
      this.micPos.x = Math.max(0, Math.min(window.innerWidth - 72, newX));
      this.micPos.y = Math.max(64, Math.min(window.innerHeight - 72, newY)); // Below header
      this.micMoved = true;
    },

    _onMicDragEnd() {
      this.micDragging = false;
      this.micMoved = false;
      if (this._micMoveHandler) {
        document.removeEventListener('mousemove', this._micMoveHandler);
      }
      if (this._micUpHandler) {
        document.removeEventListener('mouseup', this._micUpHandler);
      }
      this._micMoveHandler = null;
      this._micUpHandler = null;
      document.body.style.userSelect = '';
    },

    _repositionMicOnResize() {
      this.micPos.x = Math.min(this.micPos.x, Math.max(0, window.innerWidth - 72));
      this.micPos.y = Math.min(this.micPos.y, Math.max(64, window.innerHeight - 72));
    },

    // ─── WebSocket & Recording ───
    async initWebSocket() {
      // Generate session ID
      this.sessionId = 'session_' + crypto.randomUUID().replace(/-/g, '').slice(0, 16);
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      this.wsUrl = `${protocol}//${window.location.host}/ws/studio/${this.sessionId}/`;

      this.ws = new WebSocket(this.wsUrl);

      this.ws.onopen = () => {
        console.log('WebSocket connected');
        this.connecting = false;
      };

      this.ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          this.handleWsMessage(msg);
        } catch (e) {
          console.error('WS parse error:', e);
        }
      };

      this.ws.onerror = (err) => {
        console.error('WebSocket error:', err);
        this.error = 'WebSocket connection error';
        this.connecting = false;
      };

      this.ws.onclose = () => {
        console.log('WebSocket closed');
        this.connecting = false;
        if (this.recording) {
          this.recording = false;
          this.state = 'idle';
        }
      };
    },

    handleWsMessage(msg) {
      console.log('WS message:', msg.type, msg);
      switch (msg.type) {
        case 'connected':
          console.log('Connected:', msg.message);
          break;
        case 'started':
          console.log('Recording started');
          this.state = 'recording';
          this.elapsedMs = 0;
          this.startElapsedTimer();
          break;
        case 'stats':
          this.elapsedMs = msg.duration_ms || 0;
          break;
        case 'saved':
          this.saved = msg;
          if (msg.take_id) {
            this.takeId = msg.take_id;
          }
          break;
        case 'normalizing':
          this.state = 'normalizing';
          this.normalizing = true;
          this.normalizeMessage = msg.message;
          break;
        case 'normalized':
          this.normalizing = false;
          this.normalized = msg;
          this.state = 'vadRunning';
          break;
        case 'vad_started':
          this.vadRunning = true;
          this.vadMessage = msg.message;
          break;
        case 'vad_complete':
          this.vadRunning = false;
          if (msg.segments) {
            this.metrics.speakerCount = msg.speaker_turns?.length || 0;
            this.metrics.speakers = msg.speaker_turns || [];
          }
          this.state = 'transcribing';
          break;
        case 'transcribing_started':
          this.transcribing = true;
          this.transcribeMessage = msg.message;
          break;
        case 'transcribing_complete':
          this.transcribing = false;
          this.languageDetected = msg.language;
          this.languageProbability = msg.language_probability;
          this.metrics.language = msg.language;
          this.metrics.latencyMs = Math.round(msg.duration_ms / (msg.segments?.length || 1));
          this.createTabFromResult(msg);
          this.state = 'idle';
          this.recording = false;
          this.stopElapsedTimer();
          break;
        case 'live_transcript_update':
          this.liveTranscriptText = msg.text;
          this.liveSegmentCount = msg.segment_count;
          this.liveLanguage = msg.language;
          this.languageProbability = msg.language_probability;
          this.updateLiveMetrics(msg);
          break;
        case 'live_translation_update':
          this.liveTranslationText = msg.translated;
          break;
        case 'translation_started':
          this.micTranslationLoading = true;
          break;
        case 'translation_complete':
          this.micTranslationLoading = false;
          this.micTranslationText = msg.text;
          this.micTranslationSource = msg.source_language;
          break;
        case 'tts_started':
          break;
        case 'tts_complete':
          break;
        case 'error':
          this.error = msg.message;
          this.connecting = false;
          this.recording = false;
          this.state = 'idle';
          this.stopElapsedTimer();
          break;
        case 'translation_target_ack':
          console.log('Translation target ack:', msg.target_language);
          break;
        default:
          console.log('Unhandled WS message:', msg.type);
      }
    },

    startElapsedTimer() {
      this.elapsedTimer = setInterval(() => {
        if (this.recording) {
          this.elapsedMs += 100;
        }
      }, 100);
    },

    stopElapsedTimer() {
      if (this.elapsedTimer) {
        clearInterval(this.elapsedTimer);
        this.elapsedTimer = null;
      }
    },

    async init() {
      window.addEventListener('resize', () => this._repositionMicOnResize());
    },

    toggleRecording() {
      if (this.micMoved) {
        // Just finished a drag — don't toggle recording
        return;
      }
      if (this.pipelineBusy() && !this.recording) return;

      if (!this.recording) {
        // START recording
        await this.startRecording();
      } else {
        // STOP recording
        await this.stopRecording();
      }
    },

    async startRecording() {
      if (!this.ws || this.ws.readyState !== WebSocket.OPEN) {
        this.connecting = true;
        await this.initWebSocket();
        // Wait for connection
        await new Promise((resolve, reject) => {
          const timeout = setTimeout(() => reject(new Error('WS connection timeout')), 5000);
          const check = () => {
            if (this.ws.readyState === WebSocket.OPEN) {
              clearTimeout(timeout);
              resolve();
            } else if (this.ws.readyState === WebSocket.CLOSED) {
              clearTimeout(timeout);
              reject(new Error('WS closed'));
            } else {
              setTimeout(check, 50);
            }
          };
          check();
        });
      }

      try {
        // Get microphone access
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        this.mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
        this.audioChunks = [];

        this.mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0 && this.ws && this.ws.readyState === WebSocket.OPEN) {
            // Send binary audio chunk
            event.data.arrayBuffer().then(buffer => {
              this.ws.send(buffer);
            });
          }
        };

        this.mediaRecorder.onstop = () => {
          stream.getTracks().forEach(track => track.stop());
        };

        // Send start control message
        this.ws.send(JSON.stringify({
          type: 'start',
          mime: 'audio/webm;codecs=opus',
          translation_target: this.liveTranslationTarget,
          language_hint: this.liveLanguageHint || undefined,
          initial_prompt: this.liveInitialPrompt || undefined
        }));

        // Start recording in 100ms chunks
        this.mediaRecorder.start(100);
        this.recording = true;
        this.state = 'connecting';
        this.elapsedMs = 0;
        this.liveTranscriptText = '';
        this.liveTranslationText = '';
        this.liveSegmentCount = 0;

      } catch (err) {
        console.error('Failed to start recording:', err);
        this.error = 'Failed to access microphone: ' + err.message;
        this.connecting = false;
      }
    },

    async stopRecording() {
      if (this.mediaRecorder && this.mediaRecorder.state !== 'inactive') {
        this.mediaRecorder.stop();
      }
      if (this.ws && this.ws.readyState === WebSocket.OPEN) {
        this.ws.send(JSON.stringify({ type: 'stop' }));
      }
      this.recording = false;
      this.state = 'normalizing';
      this.stopElapsedTimer();
    },

    updateLiveMetrics(msg) {
      // Calculate WPM from live transcript
      if (msg.text) {
        const words = msg.text.trim().split(/\s+/).length;
        const minutes = this.elapsedMs / 60000;
        this.metrics.wpm = minutes > 0 ? Math.round(words / minutes) : 0;
      }
      if (msg.language) {
        this.metrics.language = msg.language;
      }
    },

    updateTranslationTarget() {
      if (this.ws && this.ws.readyState === WebSocket.OPEN) {
        this.ws.send(JSON.stringify({
          type: 'translation_target_change',
          target_language: this.liveTranslationTarget
        }));
      }
    },

    toggleNativeScript() {
      this.nativeScript = !this.nativeScript;
    },

    playVoiceClone() {
      console.log('Play voice clone');
    },

    copyTranscript() {
      console.log('Copy transcript');
    },

    exportSrt() {
      console.log('Export SRT');
    },

    _applyTabToUI(tab) {
      this.activeTabId = tab.id;
      this.activeTab = tab;
      console.log('Applied tab:', tab);
    },

    closeTab(tabId) {
      this.tabs = this.tabs.filter(t => t.id !== tabId);
      if (this.activeTabId === tabId) {
        this.activeTabId = this.tabs[0]?.id || null;
        this.activeTab = this.tabs[0] || null;
      }
    },

    stopTtsPlayback() {
      console.log('Stop TTS playback');
    },

    uploadStatusLabel() {
      if (this.upload.uploading) return 'Uploading audio…';
      if (this.upload.polling) return 'Processing…';
      return 'Idle';
    },

    translateMic() {
      this.micTranslationLoading = true;
      console.log('Translate mic to:', this.micTranslationTarget);
      setTimeout(() => {
        this.micTranslationLoading = false;
        this.micTranslationText = 'Translated text would appear here.';
        this.micTranslationSource = 'en';
      }, 1000);
    },

    getSpeaker(index) {
      return `SPEAKER_${String(index % 4).padStart(2, '0')}`;
    },

    speakerColor(speaker) {
      const colors = [
        'bg-cyan-500/20 text-cyan-300',
        'bg-emerald-500/20 text-emerald-300',
        'bg-amber-500/20 text-amber-300',
        'bg-rose-500/20 text-rose-300'
      ];
      const idx = parseInt(speaker.split('_')[1] || '0') % colors.length;
      return colors[idx];
    },

    speakerList() {
      return this.activeTab?.speakerList || this.metrics.speakers || [];
    },

    filteredSegments() {
      if (!this.activeTab?.segments) return [];
      let segs = this.activeTab.segments;
      if (this.activeSpeaker && this.activeSpeaker !== 'all') {
        segs = segs.filter(s => this.getSpeaker(s.index) === this.activeSpeaker);
      }
      return segs;
    },

    saveScriptEdit(index) {
      console.log('Save script edit:', index);
    },

    createTabFromResult(msg) {
      const takeId = msg.take_id || this.takeId || crypto.randomUUID();
      const segments = msg.segments || [];
      const speakerList = [...new Set(segments.map(s => this.getSpeaker(s.index)))];
      const durationMs = segments.length ? segments[segments.length - 1].end_ms : 0;

      const newTab = {
        id: takeId,
        title: `Recording ${new Date().toLocaleTimeString()}`,
        source: 'mic',
        durationMs: durationMs,
        language: msg.language,
        languageProbability: msg.language_probability,
        segments: segments,
        speakerList: speakerList,
        postRecording: true,
        audioUrl: `/media/recorder/TS_FINAL_${takeId.slice(0, 8)}.wav`,
        audioFilename: `recording_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.wav`,
        voiceCloningAvailable: true,
        metrics: {
          wpm: this.metrics.wpm,
          latencyMs: this.metrics.latencyMs,
          speakerCount: speakerList.length,
          speakers: speakerList,
          speakerNames: this.metrics.speakerNames,
          language: msg.language
        }
      };

      this.tabs.unshift(newTab);
      this.activeTabId = takeId;
      this.activeTab = newTab;
    },

    openExistingTab(takeId, shortId) {
      this.activeTabId = takeId;
      this.activeTab = { id: takeId, title: shortId, metrics: {} };
      console.log('Opened existing tab:', takeId);
    }
  }));

  // Expose studioRecorder instance globally for cross-component calls
  document.addEventListener('alpine:initialized', () => {
    const el = document.querySelector('[x-data="studioRecorder"]');
    if (el) {
      window.studioRecorderInstance = Alpine.$data(el);
    }
  });
});
</script>

</body>
